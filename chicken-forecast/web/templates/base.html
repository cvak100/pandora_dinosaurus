<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ app_name }} – Analiza{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a href="{{ url_for('index') }}">Napoved</a>
      <a href="{{ url_for('analiza') }}" class="{% if request.path.startswith('/analiza') %}active{% endif %}">Analiza</a>
    </nav>
    {% block body %}{% endblock %}
  </div>
</body>
</html>
